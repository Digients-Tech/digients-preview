<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Digients Tech · CUA Preview</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal-tokens.css">
  <link rel="stylesheet" href="/portal-login.css">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body class="login">
  <form id="login-form" class="login__card" novalidate>
    <div class="login__brand">Digients Tech</div>
    <h1 class="login__title">CUA Preview</h1>
    <p class="login__hint" id="login-hint">Enter the access password to explore the workflow sample.</p>
    <label for="password" id="password-label">Access password</label>
    <input id="password" class="login__input" type="password" autocomplete="current-password" required aria-describedby="login-hint">
    <p id="login-error" class="login__error" role="alert" hidden></p>
    <button id="login-submit" class="login__btn" type="submit">Enter</button>
    <button id="login-language" class="login-language" type="button" lang="zh">中文</button>
  </form>
</body>
</html>
